<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dinner Decider</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --text: #f5f5f5;
    --muted: #888;
    --accent: #ff6b35;
    --accent2: #ffd166;
    --ring: #2a2a2a;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    user-select: none;
  }

  .container {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ---- WHEEL ---- */
  .wheel-wrap {
    position: relative;
    width: 320px;
    height: 320px;
  }

  @media (max-width: 380px) {
    .wheel-wrap { width: 280px; height: 280px; }
  }

  .wheel-wrap canvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 0 0 6px var(--ring), 0 0 40px rgba(255,107,53,0.15);
    transition: box-shadow 0.3s;
  }

  .wheel-wrap.spinning canvas {
    box-shadow: 0 0 0 6px var(--accent), 0 0 60px rgba(255,107,53,0.3);
  }

  /* pointer */
  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 28px solid var(--accent);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    z-index: 2;
    transition: transform 0.1s;
  }

  .pointer.tick {
    transform: translateX(-50%) scaleY(0.85);
  }

  /* center dot */
  .center-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    background: var(--bg);
    border: 4px solid var(--ring);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: 900;
    color: var(--muted);
    z-index: 2;
  }

  /* ---- RESULT ---- */
  .result {
    text-align: center;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .result-text {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.2;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .result-text.show {
    opacity: 1;
    transform: translateY(0);
  }

  .result-sub {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 4px;
    opacity: 0;
    transition: opacity 0.4s 0.15s;
  }

  .result-sub.show { opacity: 1; }

  /* ---- SPIN BUTTON ---- */
  .spin-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 16px 48px;
    font-family: 'Inter', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,107,53,0.35); }
  .spin-btn:active { transform: scale(0.96); }
  .spin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ---- EDIT LINK ---- */
  .edit-link {
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: none;
    padding: 8px 16px;
    border-radius: 8px;
    transition: color 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .edit-link:hover { color: var(--text); }

  /* ---- MODAL ---- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid #333;
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    overflow-y: auto;
    animation: fadeUp 0.25s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal h2 {
    font-size: 1.1rem;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .modal p {
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .modal textarea {
    width: 100%;
    min-height: 280px;
    background: var(--bg);
    border: 1px solid #333;
    border-radius: 12px;
    padding: 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    line-height: 1.8;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }

  .modal textarea:focus { border-color: var(--accent); }

  .modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .modal-buttons button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }

  .btn-save { background: var(--accent); color: white; }
  .btn-save:hover { opacity: 0.9; }
  .btn-cancel { background: #333; color: var(--muted); }
  .btn-cancel:hover { background: #444; }
</style>
</head>
<body>

<div class="container">
  <h1>Dinner Decider</h1>

  <div class="wheel-wrap" id="wheelWrap">
    <div class="pointer" id="pointer"></div>
    <canvas id="wheel" width="640" height="640"></canvas>
    <div class="center-dot" id="centerDot">?</div>
  </div>

  <div class="result">
    <div class="result-text" id="resultText"></div>
    <div class="result-sub" id="resultSub"></div>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="spin()">Spin</button>

  <button class="edit-link" onclick="openEdit()">Edit options</button>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>Edit Options</h2>
    <p>One per line. Add an emoji at the start if you want.</p>
    <textarea id="editor"></textarea>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeEdit()">Cancel</button>
      <button class="btn-save" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_OPTIONS = [
  "Torchy's Tacos",
  "P. Terry's",
  "Uchi",
  "Franklin BBQ",
  "Veracruz All Natural",
  "Gus's Fried Chicken",
  "Ramen Tatsu-Ya",
  "Via 313",
  "Din Ho Chinese BBQ",
  "Kerbey Lane",
  "Hopdoddy",
  "Freebirds",
  "Chuy's",
  "Raising Cane's",
  "In-N-Out",
  "Shake Shack",
  "Chipotle",
  "Chick-fil-A",
  "Pizza (homemade)",
  "Breakfast for Dinner",
  "Stir Fry",
  "Curry Night",
  "Soup & Bread",
  "Poke Bowls"
];

// Warm, distinct colors for wheel segments
const COLORS = [
  '#ff6b35', '#ffd166', '#06d6a0', '#118ab2',
  '#9b5de5', '#ef476f', '#26547c', '#f77f00',
  '#70c1b3', '#b2dbbf', '#ff8c42', '#3d5a80',
  '#e07a5f', '#81b29a', '#f2cc8f', '#3a86ff'
];

let options = [];
let spinning = false;
let currentAngle = 0;

function loadOptions() {
  const stored = localStorage.getItem('dinnerOptions');
  if (stored) {
    try {
      const parsed = JSON.parse(stored);
      if (Array.isArray(parsed) && parsed.length >= 2) { options = parsed; return; }
    } catch(e) {}
  }
  options = [...DEFAULT_OPTIONS];
}

function saveOptions() {
  localStorage.setItem('dinnerOptions', JSON.stringify(options));
}

function parseName(text) {
  const m = text.match(/^(\p{Emoji_Presentation}|\p{Emoji}\uFE0F)\s*/u);
  return m ? text.slice(m[0].length) : text;
}

// ---- DRAW WHEEL ----
function drawWheel() {
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2, r = w / 2 - 4;
  const n = options.length;
  const arc = (2 * Math.PI) / n;

  ctx.clearRect(0, 0, w, h);

  for (let i = 0; i < n; i++) {
    const startAngle = currentAngle + i * arc;
    const endAngle = startAngle + arc;

    // segment
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();

    // thin divider
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, startAngle);
    ctx.lineTo(cx + r * Math.cos(startAngle), cy + r * Math.sin(startAngle));
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + arc / 2);

    const name = parseName(options[i]);
    const maxLen = n > 16 ? 10 : n > 10 ? 14 : 18;
    const displayName = name.length > maxLen ? name.substring(0, maxLen - 1) + '...' : name;

    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${n > 16 ? 14 : n > 10 ? 16 : 20}px Inter, sans-serif`;
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 3;
    ctx.fillText(displayName, r - 16, 5);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

// ---- SPIN ----
function spin() {
  if (spinning) return;
  spinning = true;

  const btn = document.getElementById('spinBtn');
  btn.disabled = true;

  // Hide previous result
  document.getElementById('resultText').classList.remove('show');
  document.getElementById('resultSub').classList.remove('show');
  document.getElementById('wheelWrap').classList.add('spinning');
  document.getElementById('centerDot').textContent = '?';

  const n = options.length;
  const arc = (2 * Math.PI) / n;

  // Random target: 4-7 full rotations + random segment
  const extraRotations = (4 + Math.random() * 3) * 2 * Math.PI;
  const targetSegment = Math.floor(Math.random() * n);
  // We want the pointer (top, -PI/2) to land in the middle of targetSegment
  // The segment i starts at currentAngle + i * arc
  // For pointer at -PI/2 to be in segment i: currentAngle + i*arc < -PI/2 < currentAngle + (i+1)*arc
  // So we need finalAngle = -PI/2 - (targetSegment * arc + arc/2) + small random offset within segment
  const offsetInSegment = (Math.random() - 0.5) * arc * 0.7; // stay away from edges
  const targetAngle = -(Math.PI / 2) - (targetSegment * arc + arc / 2) + offsetInSegment;
  const totalSpin = extraRotations + (targetAngle - currentAngle) % (2 * Math.PI);

  // Normalize
  const finalAngle = currentAngle + totalSpin;

  const startAngle = currentAngle;
  const duration = 4000 + Math.random() * 1000;
  const startTime = performance.now();
  let lastSegment = -1;

  function easeOutQuart(t) {
    return 1 - Math.pow(1 - t, 4);
  }

  function animate(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    const easedT = easeOutQuart(t);

    currentAngle = startAngle + (finalAngle - startAngle) * easedT;
    drawWheel();

    // Tick effect — detect segment change under pointer
    const pointerAngle = -Math.PI / 2;
    let normalizedPointer = (pointerAngle - currentAngle) % (2 * Math.PI);
    if (normalizedPointer < 0) normalizedPointer += 2 * Math.PI;
    const currentSegment = Math.floor(normalizedPointer / arc) % n;

    if (currentSegment !== lastSegment && t < 0.95) {
      lastSegment = currentSegment;
      const ptr = document.getElementById('pointer');
      ptr.classList.add('tick');
      setTimeout(() => ptr.classList.remove('tick'), 60);
      tickSound();
    }

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      // Done
      spinning = false;
      btn.disabled = false;
      document.getElementById('wheelWrap').classList.remove('spinning');

      // Figure out which segment the pointer landed on
      let angle = (pointerAngle - currentAngle) % (2 * Math.PI);
      if (angle < 0) angle += 2 * Math.PI;
      const winner = Math.floor(angle / arc) % n;
      const winnerName = parseName(options[winner]);

      document.getElementById('centerDot').textContent = '!';
      document.getElementById('resultText').textContent = winnerName;
      document.getElementById('resultText').classList.add('show');
      document.getElementById('resultSub').textContent = "That's dinner.";
      document.getElementById('resultSub').classList.add('show');

      btn.textContent = 'Spin again';
    }
  }

  requestAnimationFrame(animate);
}

// ---- AUDIO (subtle tick) ----
let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function tickSound() {
  try {
    const ctx = getAudio();
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = 800 + Math.random() * 400;
    gain.gain.setValueAtTime(0.04, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.05);
  } catch(e) {}
}

// ---- EDIT MODAL ----
function openEdit() {
  document.getElementById('editor').value = options.join('\n');
  document.getElementById('editModal').classList.add('show');
}

function closeEdit() {
  document.getElementById('editModal').classList.remove('show');
}

function saveEdit() {
  const lines = document.getElementById('editor').value
    .split('\n')
    .map(l => l.trim())
    .filter(l => l.length > 0);
  if (lines.length < 2) { alert('Need at least 2 options.'); return; }
  options = lines;
  saveOptions();
  closeEdit();
  drawWheel();
}

// ---- INIT ----
loadOptions();
drawWheel();
</script>
</body>
</html>
